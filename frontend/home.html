<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Revista Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="home-page">
    <header class="home-topbar">
        <div class="home-brand">
            <div class="logo-mark">R</div>
            <span>Revista</span>
        </div>
        <div class="home-user-box">
            <span class="home-user" id="homeUserName"></span>
            <div class="home-avatar" id="homeAvatar">?</div>
            <button id="logoutBtn" class="btn btn-ghost btn-small">
                <span>Salir</span>
            </button>
        </div>
    </header>

    <div class="home-welcome">
        <h1>Mis proyectos</h1>
        <p class="home-subtitle">Creá una nueva revista de moda o continuá donde quedaste.</p>
        <button id="newProjectBtn" class="btn btn-primary">+ Nuevo proyecto</button>
    </div>

    <main class="projects-grid" id="projectsGrid"></main>

    <div class="home-empty hidden" id="homeEmpty">
        <div class="empty-icon">📰</div>
        <p>No tenés proyectos todavía. Empezá creando tu primera revista.</p>
        <button id="emptyNewBtn" class="btn btn-primary">+ Nuevo proyecto</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
