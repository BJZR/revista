version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: revista-db
    environment:
      POSTGRES_USER: revista
      POSTGRES_PASSWORD: revista123
      POSTGRES_DB: revista_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revista -d revista_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
